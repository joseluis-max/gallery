<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; }

    .app {
      --surface: #faf9f8; --raised: #ffffff; --ink: #0a0a0a; --muted: #6b6864;
      --border: #ece9e6; --border-strong: #dcd8d4;
      --accent-ink: #ffffff; --wash: color-mix(in oklab, var(--accent) 10%, transparent);
      --r-md: 6px; --r-lg: 8px;
      --ease: cubic-bezier(.2, .7, .3, 1);
      width: 1280px; min-height: 980px;
      background: var(--surface); color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased;
    }
    .app.dark {
      --surface: #0a0a0a; --raised: #131211; --ink: #f5f5f4; --muted: #a3a09b;
      --border: #1f1d1b; --border-strong: #302d2a; --accent-ink: #0a0a0a;
    }
    .display { font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif; font-weight: 400; }
    a { color: inherit; text-decoration: none; }
    .eyebrow { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
    .icon { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .navlink { color: var(--muted); transition: color .15s var(--ease); }
    .navlink:hover { color: var(--ink); }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      border-radius: 999px; padding: 10px 18px; font: inherit; font-size: 12px;
      letter-spacing: .1em; text-transform: uppercase; border: 1px solid transparent; cursor: pointer;
      transition: transform .15s var(--ease), background-color .18s, color .18s, border-color .18s, box-shadow .18s;
    }
    .btn:active { transform: translateY(1px); }
    .btn-primary { background: var(--ink); color: var(--surface); }
    .btn-ghost { border-color: var(--border-strong); color: var(--ink); }
    .btn-ghost:hover { border-color: var(--ink); }
    .chip {
      display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border);
      border-radius: 999px; padding: 5px 12px; font-size: 11px; letter-spacing: .08em;
      text-transform: uppercase; color: var(--muted); cursor: pointer; background: transparent;
      font-family: inherit; white-space: nowrap; transition: all .18s var(--ease);
    }
    .chip:hover { border-color: var(--ink); color: var(--ink); }
    .chip.on { background: var(--ink); border-color: var(--ink); color: var(--surface); }

    /* The mosaic keeps the shipped 1–2px gaps and the feature/wide/tall/small rhythm from
       MosaicGrid.astro. Hovering does exactly two things: a veil for contrast, and the
       add-to-cart control — no filename, no price. The photograph is the content, and a
       label on top of it is something to read instead of looking. */
    .tile { position: relative; overflow: hidden; border-radius: var(--r-md); background: var(--border); cursor: pointer; }
    .tile .ph { width: 100%; height: 100%; transition: transform .55s var(--ease); }
    .tile:hover .ph { transform: scale(1.035); }
    .tile-veil { position: absolute; inset: 0; background: linear-gradient(to top, rgba(10,10,10,.6), rgba(10,10,10,0) 52%); opacity: 0; transition: opacity .25s var(--ease); }
    .tile:hover .tile-veil { opacity: 1; }
    .tile-add {
      position: absolute; top: 9px; right: 9px; width: 32px; height: 32px; border-radius: 999px;
      display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
      background: rgba(10,10,10,.55); color: #fff; border: 0; backdrop-filter: blur(4px);
      opacity: 0; transform: scale(.88); transition: all .2s var(--ease);
    }
    .tile:hover .tile-add, .tile-add.on { opacity: 1; transform: none; }
    .tile-add:hover { background: rgba(10,10,10,.75); }
    .tile-add.on { background: var(--accent); color: var(--accent-ink); }

    /* The lattice a screenshot picks up along with the photograph — same idea as
       PhotoWatermark.astro, drawn here as a tiled SVG so the artboard shows it. */
    .wm {
      position: absolute; inset: 0; pointer-events: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><text x='60' y='62' font-family='Georgia,serif' font-size='11' fill='rgba(255,255,255,0.30)' text-anchor='middle' transform='rotate(-30 60 60)'>© José Valdiviezo</text></svg>");
    }

    .grid { transition: opacity .22s var(--ease); }
    .fade { opacity: .3; }
    .empty { animation: rise .3s var(--ease) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    .ph { background-position: center; background-size: cover; background-repeat: no-repeat; display: block; }
    .ph-coast { background-image: url("coast.jpg"); }
    .ph-tortoise { background-image: url("tortoise.jpg"); }
    .ph-lava { background-image: url("lava.jpg"); }
    .ph-pelican { background-image: url("pelican.jpg"); }
    .ph-beach { background-image: url("beach.jpg"); }
    .ph-lagoon { background-image: url("lagoon.jpg"); }
  </style>
</helmet>

<div class="app {{themeClass}}" style="--accent: {{accent}}">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 16px 26px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: color-mix(in oklab, var(--surface) 88%, transparent); backdrop-filter: blur(8px); z-index: 20;">
    <a href="#" class="display" style="font-size: 18px;">José Valdiviezo</a>
    <nav style="display: flex; align-items: center; gap: 20px; font-size: 13px;">
      <a href="#" class="navlink">Competencias</a>
      <a href="#" class="navlink">Portafolio</a>
      <a href="#" class="navlink">Acerca de</a>
      <a href="#" class="navlink" style="display: inline-flex; gap: 7px; align-items: center;">
        <svg class="icon" viewBox="0 0 24 24"><path d="M3 4h2l2.4 10.4a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"></path><circle cx="10" cy="20" r="1"></circle><circle cx="18" cy="20" r="1"></circle></svg>
        Carrito
        <sc-if value="{{hasCart}}" hint-placeholder-val="{{true}}">
          <span style="background: var(--accent); color: var(--accent-ink); border-radius: 999px; font-size: 10px; padding: 1px 6px;">{{cartCount}}</span>
        </sc-if>
      </a>
      <a href="#" class="navlink">Iniciar sesión</a>
    </nav>
  </header>

  <div style="padding: 22px 26px 14px;">
    <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 20px;">
      <div>
        <h1 class="display" style="font-size: 30px; margin: 0;">Galería</h1>
        <p style="margin: 4px 0 0; font-size: 13px; color: var(--muted);">
          {{shownLabel}} · archivo digital $2.00, desde $1.75 llevando 3
        </p>
      </div>

      <div style="display: flex; align-items: center; gap: 9px;">
        <label style="display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--border-strong); border-radius: 999px; padding: 8px 14px; min-width: 260px; background: var(--raised); transition: border-color .15s var(--ease);">
          <svg class="icon" style="color: var(--muted);" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4 4"></path></svg>
          <input value="{{query}}" onInput="{{setQuery}}" placeholder="Buscar por nombre de archivo" style="border: 0; background: transparent; color: inherit; font: inherit; font-size: 13px; outline: none; width: 100%;">
        </label>

        <!-- Density, not a view switch: the same mosaic, tighter or looser. A runner
             scanning 300 frames wants small; someone choosing a print wants big. -->
        <div style="display: inline-flex; border: 1px solid var(--border-strong); border-radius: 999px; padding: 3px;">
          <button class="chip {{comfyClass}}" style="border: 0; padding: 4px 10px;" onClick="{{setComfy}}">Grande</button>
          <button class="chip {{denseClass}}" style="border: 0; padding: 4px 10px;" onClick="{{setDense}}">Compacta</button>
        </div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 7px; margin-top: 14px; flex-wrap: wrap;">
      <sc-for list="{{tags}}" as="tag" hint-placeholder-count="6">
        <button class="chip {{tag.onClass}}" onClick="{{tag.pick}}">{{tag.label}}</button>
      </sc-for>
      <span style="flex: 1;"></span>
      <sc-if value="{{hasCart}}" hint-placeholder-val="{{true}}">
        <a href="#" class="btn btn-primary" style="padding: 8px 16px;">
          Ver carrito ({{cartCount}})
          <svg class="icon" viewBox="0 0 24 24"><path d="M5 12h13"></path><path d="M13 6l6 6-6 6"></path></svg>
        </a>
      </sc-if>
    </div>
  </div>

  <section style="padding: 0 8px 28px;">
    <div class="grid {{fadeClass}}" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); grid-auto-rows: {{rowHeight}}; gap: {{gap}};">
      <sc-for list="{{tiles}}" as="tile" hint-placeholder-count="9">
        <div class="tile" style="grid-column: span {{tile.cols}}; grid-row: span {{tile.rows}};">
          <span class="ph {{tile.cls}}" role="img" aria-label="{{tile.title}}"></span>
          <span class="wm"></span>
          <div class="tile-veil"></div>
          <button class="tile-add {{tile.onClass}}" onClick="{{tile.add}}" aria-label="Añadir al carrito">
            <sc-if value="{{tile.inCart}}" hint-placeholder-val="{{false}}">
              <svg class="icon" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
            </sc-if>
            <sc-if value="{{tile.notInCart}}" hint-placeholder-val="{{true}}">
              <svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
            </sc-if>
          </button>
        </div>
      </sc-for>
    </div>

    <sc-if value="{{isEmpty}}" hint-placeholder-val="{{false}}">
      <div class="empty" style="padding: 70px 20px; text-align: center;">
        <svg class="icon" style="width: 26px; height: 26px; color: var(--muted);" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4 4"></path></svg>
        <p style="margin: 10px 0 0; font-size: 14px;">Ninguna fotografía coincide con «{{query}}».</p>
        <p style="margin: 4px 0 0; font-size: 12.5px; color: var(--muted);">Prueba con el número de archivo, por ejemplo dsc02314.</p>
        <button class="btn btn-ghost" style="margin-top: 14px;" onClick="{{clearQuery}}">Limpiar búsqueda</button>
      </div>
    </sc-if>

    <sc-if value="{{notEmpty}}" hint-placeholder-val="{{true}}">
      <div style="display: flex; justify-content: center; margin-top: 20px;">
        <button class="btn btn-ghost">Cargar más fotografías</button>
      </div>
    </sc-if>
  </section>
</div>
</x-dc>

<script data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light","section":"Theme"},"accent":{"editor":"color","default":"#b5502e","options":["#b5502e","#2f6f5e","#3b5a8c","#7a4a86"],"section":"Theme"},"$preview":{"width":1280,"height":980}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tag: 'todas', query: '', cart: ['lava'], density: 'comfy', fading: false };
  }

  pickTag(tag) {
    this.setState({ fading: true });
    setTimeout(() => this.setState({ tag, fading: false }), 170);
  }

  renderVals() {
    // Shapes follow MosaicGrid's PATTERN: one feature, then small/tall/wide beats.
    const all = [
      { id: 'coast', cls: 'ph-coast', title: 'dsc02172', cols: 3, rows: 2, tag: 'paisaje' },
      { id: 'tortoise', cls: 'ph-tortoise', title: 'dsc02314', cols: 1, rows: 1, tag: 'fauna' },
      { id: 'lava', cls: 'ph-lava', title: 'dsc02319', cols: 1, rows: 2, tag: 'paisaje' },
      { id: 'pelican', cls: 'ph-pelican', title: 'dsc02401', cols: 1, rows: 1, tag: 'fauna' },
      { id: 'beach', cls: 'ph-beach', title: 'dsc02455', cols: 2, rows: 1, tag: 'costa' },
      { id: 'lagoon', cls: 'ph-lagoon', title: 'dsc02488', cols: 2, rows: 2, tag: 'costa' },
      { id: 'coast2', cls: 'ph-coast', title: 'dsc02501', cols: 1, rows: 1, tag: 'paisaje' },
      { id: 'tortoise2', cls: 'ph-tortoise', title: 'dsc02533', cols: 1, rows: 1, tag: 'fauna' },
      { id: 'beach2', cls: 'ph-beach', title: 'dsc02547', cols: 2, rows: 1, tag: 'costa' },
    ];
    const tags = ['todas', 'paisaje', 'fauna', 'costa'];
    const q = this.state.query.trim().toLowerCase();

    const visible = all
      .filter((p) => this.state.tag === 'todas' || p.tag === this.state.tag)
      .filter((p) => !q || p.title.includes(q));

    const dense = this.state.density === 'dense';

    return {
      themeClass: (this.props.theme ?? 'light') === 'dark' ? 'dark' : '',
      accent: this.props.accent ?? '#b5502e',

      query: this.state.query,
      setQuery: (e) => this.setState({ query: e.target.value }),
      clearQuery: () => this.setState({ query: '' }),

      tags: tags.map((t) => ({
        label: t,
        onClass: this.state.tag === t ? 'on' : '',
        pick: () => this.pickTag(t),
      })),

      comfyClass: dense ? '' : 'on',
      denseClass: dense ? 'on' : '',
      setComfy: () => this.setState({ density: 'comfy' }),
      setDense: () => this.setState({ density: 'dense' }),
      rowHeight: dense ? '104px' : '150px',
      gap: dense ? '3px' : '6px',

      cartCount: this.state.cart.length,
      hasCart: this.state.cart.length > 0,
      shownLabel: visible.length * 31 + ' fotografías',
      fadeClass: this.state.fading ? 'fade' : '',
      isEmpty: visible.length === 0,
      notEmpty: visible.length > 0,

      tiles: visible.map((p) => ({
        ...p,
        inCart: this.state.cart.includes(p.id),
        notInCart: !this.state.cart.includes(p.id),
        onClass: this.state.cart.includes(p.id) ? 'on' : '',
        add: () => this.setState({
          cart: this.state.cart.includes(p.id)
            ? this.state.cart.filter((x) => x !== p.id)
            : this.state.cart.concat(p.id),
        }),
      })),
    };
  }
}
</script>
</body>
</html>
