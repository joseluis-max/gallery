<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; }

    .app {
      --surface: #faf9f8; --raised: #ffffff; --ink: #0a0a0a; --muted: #6b6864;
      --border: #ece9e6; --border-strong: #dcd8d4;
      --accent-ink: #ffffff; --wash: color-mix(in oklab, var(--accent) 10%, transparent);
      --r-md: 6px; --r-lg: 8px;
      --ease: cubic-bezier(.2, .7, .3, 1);
      width: 1280px; min-height: 900px;
      background: var(--surface); color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased;
    }
    .app.dark {
      --surface: #0a0a0a; --raised: #131211; --ink: #f5f5f4; --muted: #a3a09b;
      --border: #1f1d1b; --border-strong: #302d2a; --accent-ink: #0a0a0a;
    }
    .display { font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif; font-weight: 400; }
    a { color: inherit; text-decoration: none; }
    .eyebrow { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
    .icon { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .navlink { color: var(--muted); transition: color .15s var(--ease); }
    .navlink:hover { color: var(--ink); }
    .chip {
      display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border);
      border-radius: 999px; padding: 5px 12px; font-size: 11px; letter-spacing: .08em;
      text-transform: uppercase; color: var(--muted); cursor: pointer; background: transparent;
      font-family: inherit; white-space: nowrap; transition: all .18s var(--ease);
    }
    .chip:hover { border-color: var(--ink); color: var(--ink); }
    .chip.on { background: var(--ink); border-color: var(--ink); color: var(--surface); }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      border-radius: 999px; padding: 10px 18px; font: inherit; font-size: 12px;
      letter-spacing: .1em; text-transform: uppercase; border: 1px solid var(--border-strong); cursor: pointer;
      color: var(--ink); background: transparent; transition: border-color .18s var(--ease);
    }
    .btn:hover { border-color: var(--ink); }

    /* The portfolio is not the race archive: fewer, larger frames, generous air, and a
       caption under each rather than a filename on hover. It is work to look at, not a
       set to search. */
    .plate { position: relative; overflow: hidden; border-radius: var(--r-md); background: var(--border); cursor: pointer; }
    .plate .ph { width: 100%; transition: transform .6s var(--ease); }
    .plate:hover .ph { transform: scale(1.025); }
    .wm {
      position: absolute; inset: 0; pointer-events: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><text x='80' y='82' font-family='Georgia,serif' font-size='13' fill='rgba(255,255,255,0.26)' text-anchor='middle' transform='rotate(-30 80 80)'>© José Valdiviezo</text></svg>");
    }
    .plate-add {
      position: absolute; top: 10px; right: 10px; width: 32px; height: 32px; border-radius: 999px;
      display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
      background: rgba(10,10,10,.5); color: #fff; border: 0; backdrop-filter: blur(4px);
      opacity: 0; transform: scale(.88); transition: all .2s var(--ease);
    }
    .plate:hover .plate-add, .plate-add.on { opacity: 1; transform: none; }
    .plate-add.on { background: var(--accent); }

    .ph { background-position: center; background-size: cover; background-repeat: no-repeat; display: block; }
    .ph-coast { background-image: url("coast.jpg"); }
    .ph-tortoise { background-image: url("tortoise.jpg"); }
    .ph-lava { background-image: url("lava.jpg"); }
    .ph-pelican { background-image: url("pelican.jpg"); }
    .ph-beach { background-image: url("beach.jpg"); }
    .ph-lagoon { background-image: url("lagoon.jpg"); }
  </style>
</helmet>

<div class="app {{themeClass}}" style="--accent: {{accent}}">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 16px 26px; border-bottom: 1px solid var(--border);">
    <a href="#" class="display" style="font-size: 18px;">José Valdiviezo</a>
    <nav style="display: flex; align-items: center; gap: 20px; font-size: 13px;">
      <a href="#" class="navlink">Competencias</a>
      <a href="#" class="navlink" style="color: var(--ink);">Portafolio</a>
      <a href="#" class="navlink">Acerca de</a>
      <a href="#" class="navlink" style="display: inline-flex; gap: 7px; align-items: center;">
        <svg class="icon" viewBox="0 0 24 24"><path d="M3 4h2l2.4 10.4a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"></path><circle cx="10" cy="20" r="1"></circle><circle cx="18" cy="20" r="1"></circle></svg>
        Carrito
      </a>
      <a href="#" class="navlink">Iniciar sesión</a>
    </nav>
  </header>

  <div style="max-width: 1120px; margin: 0 auto; padding: 44px 26px 60px;">
    <div style="max-width: 560px;">
      <p class="eyebrow" style="margin: 0;">Trabajo personal</p>
      <h1 class="display" style="font-size: 36px; line-height: 1.1; margin: 10px 0 0;">Portafolio</h1>
      <p style="margin: 12px 0 0; font-size: 16px; line-height: 1.65; color: var(--muted); text-wrap: pretty;">
        Fuera de las competencias: paisaje y vida silvestre, donde la misma atención a la luz natural se toma su tiempo.
      </p>
    </div>

    <div style="display: flex; align-items: center; gap: 7px; margin-top: 26px; flex-wrap: wrap;">
      <sc-for list="{{tags}}" as="tag" hint-placeholder-count="4">
        <button class="chip {{tag.onClass}}" onClick="{{tag.pick}}">{{tag.label}}</button>
      </sc-for>
    </div>

    <!-- Two columns, offset. A five-wide mosaic reads as a catalogue; this reads as a
         portfolio without inventing any new visual language. -->
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 26px; margin-top: 28px;">
      <sc-for list="{{plates}}" as="p" hint-placeholder-count="6">
        <figure style="margin: 0; padding-top: {{p.offset}};">
          <span class="plate">
            <span class="ph {{p.cls}}" role="img" aria-label="{{p.title}}" style="height: {{p.height}};"></span>
            <span class="wm"></span>
            <button class="plate-add {{p.onClass}}" onClick="{{p.add}}" aria-label="Añadir al carrito">
              <sc-if value="{{p.inCart}}" hint-placeholder-val="{{false}}">
                <svg class="icon" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
              </sc-if>
              <sc-if value="{{p.notInCart}}" hint-placeholder-val="{{true}}">
                <svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
              </sc-if>
            </button>
          </span>
          <figcaption style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-top: 9px;">
            <span>
              <span class="display" style="display: block; font-size: 16px;">{{p.caption}}</span>
              <span style="display: block; font-size: 12px; color: var(--muted); margin-top: 1px;">{{p.place}}</span>
            </span>
            <span style="font-size: 12.5px; color: var(--muted);">$2.00</span>
          </figcaption>
        </figure>
      </sc-for>
    </div>

    <div style="display: flex; justify-content: center; margin-top: 34px;">
      <button class="btn">Ver más trabajo</button>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light","section":"Theme"},"accent":{"editor":"color","default":"#b5502e","options":["#b5502e","#2f6f5e","#3b5a8c","#7a4a86"],"section":"Theme"},"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tag: 'todo', cart: [] };
  }

  renderVals() {
    const all = [
      { id: 'lagoon', cls: 'ph-lagoon', caption: 'Laguna con veleros', place: 'Cajas, Azuay', tag: 'paisaje', height: '420px', offset: '0px' },
      { id: 'tortoise', cls: 'ph-tortoise', caption: 'Tortuga en las tierras altas', place: 'Santa Cruz', tag: 'fauna', height: '340px', offset: '48px' },
      { id: 'lava', cls: 'ph-lava', caption: 'Roca de lava y laguna', place: 'Isabela', tag: 'paisaje', height: '360px', offset: '0px' },
      { id: 'pelican', cls: 'ph-pelican', caption: 'Pelícano en el manglar', place: 'Puerto Ayora', tag: 'fauna', height: '420px', offset: '30px' },
      { id: 'coast', cls: 'ph-coast', caption: 'La costa desde el mar', place: 'Isabela', tag: 'paisaje', height: '300px', offset: '0px' },
      { id: 'beach', cls: 'ph-beach', caption: 'Lobo marino en la playa', place: 'Puerto Ayora', tag: 'fauna', height: '340px', offset: '30px' },
    ];
    const tags = ['todo', 'paisaje', 'fauna'];
    const visible = this.state.tag === 'todo' ? all : all.filter((p) => p.tag === this.state.tag);

    return {
      themeClass: (this.props.theme ?? 'light') === 'dark' ? 'dark' : '',
      accent: this.props.accent ?? '#b5502e',
      tags: tags.map((t) => ({
        label: t,
        onClass: this.state.tag === t ? 'on' : '',
        pick: () => this.setState({ tag: t }),
      })),
      plates: visible.map((p) => ({
        ...p,
        title: p.caption,
        inCart: this.state.cart.includes(p.id),
        notInCart: !this.state.cart.includes(p.id),
        onClass: this.state.cart.includes(p.id) ? 'on' : '',
        add: () => this.setState({
          cart: this.state.cart.includes(p.id)
            ? this.state.cart.filter((x) => x !== p.id)
            : this.state.cart.concat(p.id),
        }),
      })),
    };
  }
}
</script>
</body>
</html>
