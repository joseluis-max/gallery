<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; }

    .app {
      --surface: #faf9f8; --raised: #ffffff; --ink: #0a0a0a; --muted: #6b6864;
      --border: #ece9e6; --border-strong: #dcd8d4;
      --accent-ink: #ffffff; --wash: color-mix(in oklab, var(--accent) 10%, transparent);
      --r-md: 6px; --r-lg: 8px;
      --ease: cubic-bezier(.2, .7, .3, 1);
      width: 1360px; min-height: 860px;
      background: var(--surface); color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13.5px; line-height: 1.45; -webkit-font-smoothing: antialiased;
      display: grid; grid-template-columns: 216px minmax(0, 1fr);
    }
    .app.dark {
      --surface: #0a0a0a; --raised: #131211; --ink: #f5f5f4; --muted: #a3a09b;
      --border: #1f1d1b; --border-strong: #302d2a; --accent-ink: #0a0a0a;
    }
    .display { font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif; font-weight: 400; }
    a { color: inherit; text-decoration: none; }
    .eyebrow { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
    .panel { border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--raised); }
    .icon { width: 15px; height: 15px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      border-radius: 999px; padding: 8px 15px; font: inherit; font-size: 11px;
      letter-spacing: .09em; text-transform: uppercase; border: 1px solid transparent; cursor: pointer;
      transition: transform .15s var(--ease), background-color .18s, color .18s, border-color .18s, box-shadow .18s, opacity .18s;
    }
    .btn:active { transform: translateY(1px); }
    .btn-primary { background: var(--ink); color: var(--surface); }
    .btn-ghost { border-color: var(--border-strong); color: var(--ink); }
    .btn-ghost:hover { border-color: var(--ink); }
    .field { border: 1px solid var(--border-strong); border-radius: var(--r-md); background: transparent; color: inherit; padding: 7px 11px; font: inherit; font-size: 12.5px; }

    .nav a { display: flex; align-items: center; gap: 9px; padding: 7px 10px; border-radius: var(--r-md); color: var(--muted); font-size: 13px; transition: all .15s var(--ease); }
    .nav a:hover { color: var(--ink); background: color-mix(in oklab, var(--ink) 5%, transparent); }
    .nav a.on { background: var(--ink); color: var(--surface); }

    .prow { display: grid; grid-template-columns: 26px 56px minmax(0, 1fr) 110px 190px 132px; gap: 12px; align-items: center; padding: 8px 10px; border-radius: var(--r-md); border: 1px solid transparent; transition: all .16s var(--ease); }
    .prow:hover { background: color-mix(in oklab, var(--ink) 4%, transparent); }
    .prow.on { border-color: var(--accent); background: var(--wash); }
    .thumb { width: 56px; height: 38px; border-radius: 4px; }
    .box {
      width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--border-strong);
      display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
      background: transparent; color: var(--surface); padding: 0; transition: all .15s var(--ease);
    }
    .box.on { background: var(--ink); border-color: var(--ink); }
    .tag { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 2px 9px; font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; }
    .tag-live { background: var(--ink); color: var(--surface); }
    .tag-draft { border: 1px solid var(--border-strong); color: var(--muted); }
    .bulk { animation: rise .22s var(--ease) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }

    .ph { background-position: center; background-size: cover; background-repeat: no-repeat; display: block; }
    .ph-coast { background-image: url("coast.jpg"); }
    .ph-tortoise { background-image: url("tortoise.jpg"); }
    .ph-lava { background-image: url("lava.jpg"); }
    .ph-pelican { background-image: url("pelican.jpg"); }
    .ph-beach { background-image: url("beach.jpg"); }
    .ph-lagoon { background-image: url("lagoon.jpg"); }
  </style>
</helmet>

<div class="app {{themeClass}}" style="--accent: {{accent}}">

  <aside style="border-right: 1px solid var(--border); padding: 18px 14px;">
    <p class="display" style="margin: 0; font-size: 16px;">José Valdiviezo</p>
    <p class="eyebrow" style="margin: 3px 0 0;">Admin</p>
    <nav class="nav" style="margin-top: 22px; display: grid; gap: 2px;">
      <a href="#"><svg class="icon" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"></rect><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"></rect><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"></rect><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"></rect></svg>Dashboard</a>
      <a href="#"><svg class="icon" viewBox="0 0 24 24"><path d="M12 16V5"></path><path d="M8 9l4-4 4 4"></path><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"></path></svg>Upload</a>
      <a href="#" class="on"><svg class="icon" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2"></rect><circle cx="9" cy="10" r="1.6"></circle><path d="M4 17l5-4 4 3 3-2 4 3"></path></svg>Photos</a>
      <a href="#"><svg class="icon" viewBox="0 0 24 24"><path d="M4 6h16"></path><path d="M4 12h16"></path><path d="M4 18h10"></path></svg>Orders</a>
      <a href="#"><svg class="icon" viewBox="0 0 24 24"><path d="M3.5 9.5L12 4.5l8.5 5"></path><path d="M3 19.5h18"></path><path d="M5.5 9.5v8"></path><path d="M18.5 9.5v8"></path></svg>Transfers</a>
      <a href="#"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2"></circle><path d="M5 20c1.2-3.4 3.9-5 7-5s5.8 1.6 7 5"></path></svg>Customers</a>
      <a href="#"><svg class="icon" viewBox="0 0 24 24"><path d="M6 4v16"></path><path d="M18 4v16"></path><path d="M6 9h12"></path><path d="M6 15h12"></path></svg>Pricing</a>
    </nav>
  </aside>

  <main style="padding: 20px 24px 40px; overflow: hidden;">
    <div style="display: flex; align-items: baseline; justify-content: space-between;">
      <h1 class="display" style="font-size: 24px; margin: 0;">Photos</h1>
      <span style="font-size: 12px; color: var(--muted);">{{total}} fotografías · {{draftCount}} en borrador</span>
    </div>

    <div style="display: flex; align-items: center; gap: 9px; margin-top: 14px; flex-wrap: wrap;">
      <label style="display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--border-strong); border-radius: 999px; padding: 6px 13px; min-width: 230px; background: var(--raised);">
        <svg class="icon" style="color: var(--muted);" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4 4"></path></svg>
        <input placeholder="Buscar por título" style="border: 0; background: transparent; color: inherit; font: inherit; font-size: 12.5px; outline: none; width: 100%;">
      </label>
      <select class="field"><option>Todas las competencias</option><option>Vuelta al Cajas 2026</option></select>
      <select class="field"><option>Todos los estados</option><option>Publicadas</option><option>Borrador</option></select>
    </div>

    <!-- The bulk bar only exists while something is selected. Publishing 180 drafts is the
         job this page is for, so the action rides with the selection instead of living in
         a toolbar that is disabled 95% of the time. -->
    <sc-if value="{{hasSelection}}" hint-placeholder-val="{{true}}">
      <div class="panel bulk" style="margin-top: 12px; display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-color: color-mix(in oklab, var(--accent) 40%, transparent); background: var(--wash);">
        <span style="font-size: 13px;">{{selectedCount}} seleccionadas</span>
        <span style="flex: 1;"></span>
        <button class="btn btn-primary" onClick="{{publishSelected}}">
          <svg class="icon" style="width: 13px; height: 13px;" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
          Publicar
        </button>
        <button class="btn btn-ghost" onClick="{{unpublishSelected}}">Despublicar</button>
        <button class="btn btn-ghost" onClick="{{clearSelection}}">Cancelar</button>
      </div>
    </sc-if>

    <section class="panel" style="margin-top: 12px; padding: 8px;">
      <div class="prow" style="padding-top: 4px; padding-bottom: 8px;">
        <span>
          <button class="box {{allClass}}" onClick="{{toggleAll}}" aria-label="Seleccionar todo">
            <sc-if value="{{allSelected}}" hint-placeholder-val="{{false}}">
              <svg class="icon" style="width: 11px; height: 11px;" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
            </sc-if>
          </button>
        </span>
        <span class="eyebrow"></span>
        <span class="eyebrow">Título</span>
        <span class="eyebrow">Estado</span>
        <span class="eyebrow">Competencia</span>
        <span class="eyebrow" style="text-align: right;">Acciones</span>
      </div>

      <sc-for list="{{photos}}" as="p" hint-placeholder-count="7">
        <div class="prow {{p.rowClass}}">
          <span>
            <button class="box {{p.boxClass}}" onClick="{{p.toggle}}" aria-label="Seleccionar">
              <sc-if value="{{p.selected}}" hint-placeholder-val="{{false}}">
                <svg class="icon" style="width: 11px; height: 11px;" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
              </sc-if>
            </button>
          </span>
          <span class="ph {{p.cls}} thumb" role="img" aria-label="{{p.title}}"></span>
          <span class="mono" style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{p.title}}</span>
          <span><span class="tag {{p.tagClass}}">{{p.statusLabel}}</span></span>
          <span style="color: var(--muted); font-size: 12.5px;">{{p.competition}}</span>
          <span style="text-align: right; display: flex; gap: 7px; justify-content: flex-end;">
            <button class="btn btn-ghost" style="padding: 5px 11px;" onClick="{{p.toggleStatus}}">{{p.actionLabel}}</button>
            <a href="#" class="btn btn-ghost" style="padding: 5px 11px;">Editar</a>
          </span>
        </div>
      </sc-for>
    </section>
  </main>
</div>
</x-dc>

<script data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light","section":"Theme"},"accent":{"editor":"color","default":"#b5502e","options":["#b5502e","#2f6f5e","#3b5a8c","#7a4a86"],"section":"Theme"},"$preview":{"width":1360,"height":860}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      selected: ['b', 'c'],
      photos: [
        { id: 'a', cls: 'ph-coast', title: 'dsc02172', competition: 'Vuelta al Cajas 2026', published: true },
        { id: 'b', cls: 'ph-tortoise', title: 'dsc02314', competition: 'Vuelta al Cajas 2026', published: false },
        { id: 'c', cls: 'ph-lava', title: 'dsc02319', competition: 'Vuelta al Cajas 2026', published: false },
        { id: 'd', cls: 'ph-pelican', title: 'dsc02401', competition: 'Maratón de Cuenca', published: true },
        { id: 'e', cls: 'ph-beach', title: 'dsc02455', competition: 'Maratón de Cuenca', published: true },
        { id: 'f', cls: 'ph-lagoon', title: 'dsc02488', competition: 'Portafolio', published: false },
      ],
    };
  }

  setPublished(ids, published) {
    this.setState({
      photos: this.state.photos.map((p) => (ids.includes(p.id) ? { ...p, published } : p)),
      selected: [],
    });
  }

  renderVals() {
    const sel = this.state.selected;
    const all = this.state.photos;

    return {
      themeClass: (this.props.theme ?? 'light') === 'dark' ? 'dark' : '',
      accent: this.props.accent ?? '#b5502e',

      total: all.length * 31,
      draftCount: all.filter((p) => !p.published).length,

      hasSelection: sel.length > 0,
      selectedCount: sel.length,
      allSelected: sel.length === all.length,
      allClass: sel.length === all.length ? 'on' : '',
      toggleAll: () => this.setState({ selected: sel.length === all.length ? [] : all.map((p) => p.id) }),
      clearSelection: () => this.setState({ selected: [] }),
      publishSelected: () => this.setPublished(sel, true),
      unpublishSelected: () => this.setPublished(sel, false),

      photos: all.map((p) => ({
        ...p,
        selected: sel.includes(p.id),
        boxClass: sel.includes(p.id) ? 'on' : '',
        rowClass: sel.includes(p.id) ? 'on' : '',
        tagClass: p.published ? 'tag-live' : 'tag-draft',
        statusLabel: p.published ? 'Publicada' : 'Borrador',
        actionLabel: p.published ? 'Despublicar' : 'Publicar',
        toggle: () => this.setState({
          selected: sel.includes(p.id) ? sel.filter((x) => x !== p.id) : sel.concat(p.id),
        }),
        toggleStatus: () => this.setState({
          photos: all.map((x) => (x.id === p.id ? { ...x, published: !x.published } : x)),
        }),
      })),
    };
  }
}
</script>
</body>
</html>
