<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; }

    .app {
      --surface: #faf9f8; --raised: #ffffff; --ink: #0a0a0a; --muted: #6b6864;
      --border: #ece9e6; --border-strong: #dcd8d4;
      --accent-ink: #ffffff; --wash: color-mix(in oklab, var(--accent) 10%, transparent);
      --r-md: 6px; --r-lg: 8px;
      --ease: cubic-bezier(.2, .7, .3, 1);
      width: 900px; min-height: 620px;
      background: var(--surface); color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased;
      display: flex; flex-direction: column;
    }
    .app.dark {
      --surface: #0a0a0a; --raised: #131211; --ink: #f5f5f4; --muted: #a3a09b;
      --border: #1f1d1b; --border-strong: #302d2a; --accent-ink: #0a0a0a;
    }
    .display { font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif; font-weight: 400; }
    a { color: inherit; text-decoration: none; }
    .icon { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .navlink { color: var(--muted); transition: color .15s var(--ease); }
    .navlink:hover { color: var(--ink); }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      border-radius: 999px; padding: 10px 18px; font: inherit; font-size: 12px;
      letter-spacing: .1em; text-transform: uppercase; border: 1px solid transparent; cursor: pointer;
      transition: transform .15s var(--ease), background-color .18s, color .18s, border-color .18s, box-shadow .18s;
    }
    .btn-primary { background: var(--ink); color: var(--surface); }
    .btn-ghost { border-color: var(--border-strong); color: var(--ink); }
    .btn-ghost:hover { border-color: var(--ink); }

    .thumb { border-radius: var(--r-md); overflow: hidden; height: 84px; transition: transform .3s var(--ease); }
    .thumb:hover { transform: translateY(-2px); }
    .ph { background-position: center; background-size: cover; background-repeat: no-repeat; display: block; width: 100%; height: 100%; }
    .ph-coast { background-image: url("coast.jpg"); }
    .ph-tortoise { background-image: url("tortoise.jpg"); }
    .ph-lava { background-image: url("lava.jpg"); }
    .ph-beach { background-image: url("beach.jpg"); }
  </style>
</helmet>

<div class="app {{themeClass}}" style="--accent: {{accent}}">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 16px 32px; border-bottom: 1px solid var(--border);">
    <a href="#" class="display" style="font-size: 18px;">José Valdiviezo</a>
    <nav style="display: flex; align-items: center; gap: 20px; font-size: 13px;">
      <a href="#" class="navlink">Competencias</a>
      <a href="#" class="navlink">Portafolio</a>
      <a href="#" class="navlink">Acerca de</a>
    </nav>
  </header>

  <div style="margin: auto; padding: 40px 32px; text-align: center; max-width: 520px;">
    <span style="display: inline-flex; width: 46px; height: 46px; align-items: center; justify-content: center; border-radius: 999px; background: var(--wash); color: var(--accent);">
      <svg class="icon" style="width: 23px; height: 23px;" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2"></rect><circle cx="9" cy="10" r="1.6"></circle><path d="M4 17l5-4 4 3 3-2 4 3"></path></svg>
    </span>
    <h1 class="display" style="font-size: 30px; margin: 16px 0 0;">Fotografía no encontrada</h1>
    <p style="margin: 10px 0 0; color: var(--muted);">
      Esta fotografía ya no está disponible o el enlace es incorrecto. Si venías de una competencia, sigue ahí.
    </p>
    <div style="display: flex; gap: 10px; justify-content: center; margin-top: 22px;">
      <a href="#" class="btn btn-primary">
        Ver competencias
        <svg class="icon" viewBox="0 0 24 24"><path d="M5 12h13"></path><path d="M13 6l6 6-6 6"></path></svg>
      </a>
      <a href="#" class="btn btn-ghost">Todas las fotografías</a>
    </div>

    <!-- A dead end is a good place to offer the thing they were probably looking for. -->
    <p style="margin: 34px 0 10px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);">Publicadas recientemente</p>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px;">
      <a href="#" class="thumb"><span class="ph ph-coast" role="img" aria-label="dsc02172"></span></a>
      <a href="#" class="thumb"><span class="ph ph-tortoise" role="img" aria-label="dsc02314"></span></a>
      <a href="#" class="thumb"><span class="ph ph-lava" role="img" aria-label="dsc02319"></span></a>
      <a href="#" class="thumb"><span class="ph ph-beach" role="img" aria-label="dsc02455"></span></a>
    </div>
  </div>

  <footer style="padding: 18px 32px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted);">
    © 2026 José Valdiviezo — Cuenca, Ecuador
  </footer>
</div>
</x-dc>

<script data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light","section":"Theme"},"accent":{"editor":"color","default":"#b5502e","options":["#b5502e","#2f6f5e","#3b5a8c","#7a4a86"],"section":"Theme"},"$preview":{"width":900,"height":620}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      themeClass: (this.props.theme ?? 'light') === 'dark' ? 'dark' : '',
      accent: this.props.accent ?? '#b5502e',
    };
  }
}
</script>
</body>
</html>
